<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Windows 11 Mobile</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;overflow:hidden}
button{border:0;border-radius:8px;padding:10px;background:#e4eff8;color:#17334d;cursor:pointer}
#lock,#login{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(140deg,#071b38,#0878bd,#55b5d7);color:white}
#lock{cursor:pointer;touch-action:manipulation}
#lock h1{font-size:60px;font-weight:300;margin:0}
#unlockButton{background:#ffffff30;color:white;border:1px solid white;margin-top:20px;padding:15px 25px;font-size:17px}
#login{display:none}
#login input{padding:13px;border:0;border-radius:8px;text-align:center;margin:12px}
#desktop{display:none;position:fixed;inset:0;background:linear-gradient(135deg,#075a9e,#158dcc,#70c7dd);color:white}
#icons{position:absolute;top:15px;left:12px;display:grid;gap:15px}
.desktop-icon{width:80px;text-align:center;font-size:12px;padding:6px;cursor:pointer;border-radius:7px}
.desktop-icon span{display:block;font-size:34px;margin-bottom:5px}
.desktop-icon:active{background:#ffffff44}
#taskbar{position:absolute;bottom:0;left:0;right:0;height:54px;background:#eaf3f9ed;display:flex;align-items:center;justify-content:center;gap:9px;color:#17334d;z-index:500}
.taskbtn{font-size:22px;background:transparent;min-width:42px;height:42px}
#clock{position:absolute;right:10px;font-size:11px;text-align:right}
#startMenu{display:none;position:absolute;bottom:61px;left:50%;transform:translateX(-50%);width:min(340px,94vw);height:400px;background:#edf4fa;color:#18334c;border-radius:14px;padding:16px;z-index:600}
#startMenu input{width:100%;padding:10px;border:1px solid #aaa;border-radius:7px;margin-bottom:15px}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.appbtn{padding:16px 5px;background:#dce9f4;font-size:13px}
.window{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:min(650px,96vw);height:min(470px,75vh);background:#f3f7fa;color:#20384d;border-radius:12px;box-shadow:0 10px 40px #0006;overflow:hidden;display:flex;flex-direction:column;z-index:100}
.titlebar{height:43px;flex-shrink:0;background:#e3edf5;display:flex;align-items:center;justify-content:space-between;padding-left:12px}
.titlebar button{height:40px;background:transparent;border-radius:0}
.titlebar button:last-child{color:#b22}
.window-content{padding:14px;overflow:auto;flex:1}
.explorer-tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
.filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:12px}
.fileitem{text-align:center;padding:12px 5px;border-radius:8px;font-size:12px;overflow-wrap:anywhere;cursor:pointer}
.fileitem:active{background:#c8e3f7}
.fileitem span{display:block;font-size:34px;margin-bottom:6px}
textarea{width:100%;min-height:190px;padding:10px;border:1px solid #b6c8d7;border-radius:7px;color:#20384d}
.primary{background:#1678bd;color:white}
.actionrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.calc button{padding:15px;font-size:18px}
#calcDisplay{width:100%;padding:14px;font-size:24px;margin-bottom:10px}
.setting-row{padding:12px 0;border-bottom:1px solid #ddd}
#toast{display:none;position:absolute;bottom:65px;left:50%;transform:translateX(-50%);background:#142c40;color:white;padding:12px 18px;border-radius:8px;z-index:10000}
</style>
</head>
<body>

<div id="lock" onclick="unlock()">
 <h1 id="lockTime">20:00</h1>
 <p id="lockDate">Bienvenido</p>
 <p>Windows 11 Mobile</p>
 <button id="unlockButton" onclick="event.stopPropagation();unlock()">TOCAR PARA INICIAR</button>
</div>

<div id="login">
 <div style="font-size:65px">👤</div>
 <h2>Usuario</h2>
 <p>Bienvenido a Windows 11</p>
 <input id="passwordInput" type="password" placeholder="Contraseña">
 <button class="primary" onclick="login()">Iniciar sesión</button>
 <p id="loginMessage"></p>
</div>

<div id="desktop">
 <div id="icons">
  <div class="desktop-icon" onclick="openExplorer('root')"><span>🗂️</span>Archivos</div>
  <div class="desktop-icon" onclick="openExplorer('trash')"><span>🗑️</span>Papelera</div>
  <div class="desktop-icon" onclick="openApp('notes')"><span>📝</span>Notas</div>
  <div class="desktop-icon" onclick="openApp('calc')"><span>🧮</span>Calculadora</div>
 </div>

 <div id="startMenu">
  <h3>Inicio</h3>
  <input id="startSearch" placeholder="Buscar aplicaciones..." oninput="searchApps(this.value)">
  <div class="apps">
   <button class="appbtn" onclick="openExplorer('root')">📁<br>Archivos</button>
   <button class="appbtn" onclick="openExplorer('trash')">🗑️<br>Papelera</button>
   <button class="appbtn" onclick="openApp('notes')">📝<br>Notas</button>
   <button class="appbtn" onclick="openApp('calc')">🧮<br>Calculadora</button>
   <button class="appbtn" onclick="openApp('settings')">⚙️<br>Configuración</button>
   <button class="appbtn" onclick="openApp('browser')">🌐<br>Navegador</button>
  </div>
 </div>

 <div id="taskbar">
  <button class="taskbtn" onclick="toggleStart()">🪟</button>
  <button class="taskbtn" onclick="openExplorer('root')">📁</button>
  <button class="taskbtn" onclick="openApp('browser')">🌐</button>
  <button class="taskbtn" onclick="openApp('notes')">📝</button>
  <button class="taskbtn" onclick="openApp('calc')">🧮</button>
  <div id="clock"></div>
 </div>
</div>

<div id="toast"></div>

<script>
"use strict";

const PHRASES=["Frase uno","Frase dos","Frase tres","Frase cuatro","Frase cinco"];
const PERMANENT_TEXTS={
 "Frase uno":"Titulo: El caballero Al espejo\nUn caballero se mira al espejo este se rompe pero se da cuenta que el malo no es el espejo solo tenía que ver lo bueno del el mismo.",
 "Frase dos":"Titulo:la verdad blanca y negra\nLos máscara negra te darán la espada\nla máscara blanca se queda el tiempo que necesites.",
 "Frase tres":"Titulo:un sueño amoroso\nEl amor es como una telenovela o\nCómo cuento de hadas o\nSimplemente es un sueño del que\nNadie quiere despertar.",
 "Frase cuatro":"Titulo: el miedo\nVivo con el miedo de no cumplir las expectativas de los demás pero olvidé un pequeño detalle olvidé cumplir con mis propias expectativas."
};

let fs=[];
let trash=[];
let currentFolder="root";
let z=100;
let loginStarted=false;

try{
 fs=JSON.parse(localStorage.getItem("w2files"))||[];
 trash=JSON.parse(localStorage.getItem("w2trash"))||[];
}catch(e){
 fs=[];trash=[];
}

function save(){
 localStorage.setItem("w2files",JSON.stringify(fs));
 localStorage.setItem("w2trash",JSON.stringify(trash));
}

PHRASES.forEach((name,i)=>{
 const perm=PERMANENT_TEXTS[name]??"";
 let folder=fs.find(x=>x.name===name&&x.parent==="root");
 if(!folder){
  folder=trash.find(x=>x.name===name);
  if(folder){
   trash=trash.filter(x=>x.id!==folder.id);
   folder.parent="root";
   delete folder.oldParent;
   fs.push(folder);
  }else{
   folder={id:"phrase"+i,name:name,type:"folder",parent:"root",text:perm};
   fs.push(folder);
  }
 }
 if(Object.prototype.hasOwnProperty.call(PERMANENT_TEXTS,name)){
  folder.text=perm;
 }
});
save();

function escapeHTML(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function updateClock(){
 const d=new Date();
 const t=d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
 document.getElementById("lockTime").textContent=t;
 document.getElementById("lockDate").textContent=d.toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
 document.getElementById("clock").innerHTML=t+"<br>"+d.toLocaleDateString("es-MX");
}
updateClock();
setInterval(updateClock,1000);

function unlock(){
 if(loginStarted)return;
 loginStarted=true;

 document.getElementById("lock").style.display="none";
 document.getElementById("login").style.display="flex";

 const password=localStorage.getItem("w2password")||"1234";
 const input=document.getElementById("passwordInput");
 input.value=password;

 setTimeout(login,700);
}

function login(){
 const password=localStorage.getItem("w2password")||"1234";
 const input=document.getElementById("passwordInput");

 if(input.value===password){
  document.getElementById("lock").style.display="none";
  document.getElementById("login").style.display="none";
  document.getElementById("desktop").style.display="block";
  toast("¡Bienvenido!");
 }else{
  document.getElementById("loginMessage").textContent="Contraseña incorrecta";
 }
}

function toast(msg){
 const t=document.getElementById("toast");
 t.textContent=msg;
 t.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>t.style.display="none",2200);
}

function toggleStart(){
 const s=document.getElementById("startMenu");
 s.style.display=s.style.display==="block"?"none":"block";
}

function searchApps(q){
 document.querySelectorAll(".appbtn").forEach(b=>{
  b.style.display=b.textContent.toLowerCase().includes(q.toLowerCase())?"block":"none";
 });
}

function makeWindow(title){
 const win=document.createElement("div");
 win.className="window";
 win.style.zIndex=++z;

 const bar=document.createElement("div");
 bar.className="titlebar";
 bar.innerHTML="<span>"+escapeHTML(title)+"</span>";

 const controls=document.createElement("div");
 const min=document.createElement("button");
 min.textContent="—";
 min.onclick=()=>win.style.display="none";

 const max=document.createElement("button");
 max.textContent="□";
 max.onclick=()=>{
  if(win.dataset.max==="1"){
   win.style.cssText="";
   win.className="window";
   win.style.zIndex=++z;
   win.dataset.max="0";
  }else{
   win.style.left="0";
   win.style.top="0";
   win.style.transform="none";
   win.style.width="100vw";
   win.style.height="calc(100vh - 54px)";
   win.dataset.max="1";
  }
 };

 const close=document.createElement("button");
 close.textContent="✕";
 close.onclick=()=>win.remove();

 controls.append(min,max,close);
 bar.append(controls);

 const content=document.createElement("div");
 content.className="window-content";
 win.append(bar,content);
 document.body.append(win);
 win.addEventListener("pointerdown",()=>win.style.zIndex=++z);

 return content;
}

function openExplorer(where){
 currentFolder=where;
 const c=makeWindow(where==="trash"?"Papelera":"Explorador de archivos");
 renderExplorer(c,where);
}

function renderExplorer(c,where){
 currentFolder=where;
 const items=where==="trash"?trash:fs.filter(x=>x.parent===where);

 c.innerHTML=`
 <div class="explorer-tools">
 <button id="folderBtn">＋ Nueva carpeta</button>
 <button id="fileBtn">＋ Nuevo archivo</button>
 ${where==="trash"?'<button id="emptyBtn">Vaciar papelera</button>':''}
 ${where!=="root"&&where!=="trash"?'<button id="backBtn">← Inicio</button>':''}
 </div>
 <div class="filegrid" id="filegrid"></div>`;

 c.querySelector("#folderBtn").onclick=newFolder;
 c.querySelector("#fileBtn").onclick=newFile;
 if(where==="trash")c.querySelector("#emptyBtn").onclick=emptyTrash;
 if(where!=="root"&&where!=="trash")c.querySelector("#backBtn").onclick=()=>openExplorer("root");

 const grid=c.querySelector("#filegrid");
 if(items.length===0)grid.innerHTML="<p>Esta carpeta está vacía.</p>";

 items.forEach(item=>{
  const div=document.createElement("div");
  div.className="fileitem";
  div.innerHTML="<span>"+(item.type==="folder"?"📁":"📝")+"</span>"+escapeHTML(item.name);

  let timer;
  div.onclick=()=>{
   clearTimeout(timer);
   timer=setTimeout(()=>openItem(item,where),250);
  };
  div.ondblclick=()=>{
   clearTimeout(timer);
   openItem(item,where);
  };
  div.oncontextmenu=e=>{
   e.preventDefault();
   if(confirm("¿Eliminar "+item.name+"?"))deleteItem(item,where);
  };
  grid.append(div);
 });
}

function openItem(item,where){
 if(where==="trash"){
  if(confirm("¿Restaurar "+item.name+"?")){
   trash=trash.filter(x=>x.id!==item.id);
   item.parent=item.oldParent||"root";
   delete item.oldParent;
   if(Object.prototype.hasOwnProperty.call(PERMANENT_TEXTS,item.name)){
    item.text=PERMANENT_TEXTS[item.name];
   }
   fs.push(item);
   save();
   refreshExplorer("trash");
  }
  return;
 }

 if(item.type==="folder"){
  if(PHRASES.includes(item.name))openPhrase(item);
  else openExplorer(item.id);
 }else openTextFile(item);
}

function openPhrase(item){
 const isPermanent=Object.prototype.hasOwnProperty.call(PERMANENT_TEXTS,item.name);
 if(isPermanent){
  item.text=PERMANENT_TEXTS[item.name];
  save();
 }
 const c=makeWindow(item.name);
 c.innerHTML="<p>"+(isPermanent?"Texto permanente de esta carpeta:":"Escribe lo que quieras en esta carpeta:")+"</p><textarea id='phraseText' placeholder='Escribe aquí...'></textarea><div class='actionrow'><button class='primary' id='savePhrase'>💾 Guardar</button></div>";
 const ta=c.querySelector("#phraseText");
 ta.value=item.text||"";
 if(isPermanent){
  ta.readOnly=true;
 }
 c.querySelector("#savePhrase").onclick=()=>{
  if(isPermanent){
   ta.value=PERMANENT_TEXTS[item.name];
   item.text=PERMANENT_TEXTS[item.name];
   save();
   toast("Este texto es permanente");
   return;
  }
  item.text=ta.value;
  save();
  toast("Texto guardado");
 };
}

function newFolder(){
 const name=prompt("Nombre de la carpeta:");
 if(!name)return;
 fs.push({id:"id"+Date.now(),name,type:"folder",parent:currentFolder,text:""});
 save();
 refreshExplorer(currentFolder);
}

function newFile(){
 const name=prompt("Nombre del archivo:");
 if(!name)return;
 const item={id:"id"+Date.now(),name,type:"note",parent:currentFolder,text:""};
 fs.push(item);
 save();
 refreshExplorer(currentFolder);
 openTextFile(item);
}

function openTextFile(item){
 const c=makeWindow(item.name);
 c.innerHTML="<textarea id='fileText' placeholder='Escribe aquí...'></textarea><div class='actionrow'><button class='primary' id='saveFile'>Guardar</button></div>";
 c.querySelector("#fileText").value=item.text||"";
 c.querySelector("#saveFile").onclick=()=>{
  item.text=c.querySelector("#fileText").value;
  save();
  toast("Archivo guardado");
 };
}

function deleteItem(item,where){
 if(where==="trash")return;
 if(Object.prototype.hasOwnProperty.call(PERMANENT_TEXTS,item.name)){
  toast("Esta carpeta y su texto son permanentes");
  return;
 }
 fs=fs.filter(x=>x.id!==item.id);
 item.oldParent=item.parent;
 trash.push(item);
 save();
 refreshExplorer(where);
 toast("Movido a la papelera");
}

function emptyTrash(){
 if(confirm("¿Vaciar la papelera?")){
  trash=[];
  save();
  refreshExplorer("trash");
 }
}

function refreshExplorer(where){
 const wins=document.querySelectorAll(".window");
 const last=wins[wins.length-1];
 if(last)renderExplorer(last.querySelector(".window-content"),where);
}

function openApp(app){
 document.getElementById("startMenu").style.display="none";

 if(app==="notes"){
  const c=makeWindow("Bloc de notas");
  c.innerHTML="<textarea id='notesArea' placeholder='Escribe tus notas...'></textarea><div class='actionrow'><button class='primary' id='saveNotes'>Guardar</button></div>";
  c.querySelector("#notesArea").value=localStorage.getItem("w2notes")||"";
  c.querySelector("#saveNotes").onclick=()=>{
   localStorage.setItem("w2notes",c.querySelector("#notesArea").value);
   toast("Notas guardadas");
  };
 }

 if(app==="calc"){
  const c=makeWindow("Calculadora");
  c.innerHTML="<input id='calcDisplay' value='0' readonly><div class='calc'>"+["7","8","9","÷","4","5","6","×","1","2","3","−","0",".","C","+","="].map(x=>"<button data-k='"+x+"'>"+x+"</button>").join("")+"</div>";
  c.querySelectorAll("[data-k]").forEach(b=>{
   b.onclick=()=>calcPress(b.dataset.k,c.querySelector("#calcDisplay"));
  });
 }

 if(app==="settings"){
  const c=makeWindow("Configuración");
  c.innerHTML="<h3>Personalización</h3><div class='setting-row'>Fondo: <input type='color' id='bgColor' value='"+(localStorage.getItem("w2bg")||"#0878bd")+"'><button id='applyBg'>Aplicar</button></div><div class='setting-row'>Nueva contraseña: <input id='newPassword' type='password'><button id='savePassword'>Guardar</button></div>";
  c.querySelector("#applyBg").onclick=()=>{
   const color=c.querySelector("#bgColor").value;
   document.getElementById("desktop").style.background=color;
   localStorage.setItem("w2bg",color);
   toast("Fondo cambiado");
  };
  c.querySelector("#savePassword").onclick=()=>{
   const p=c.querySelector("#newPassword").value;
   if(!p)return toast("Escribe una contraseña");
   localStorage.setItem("w2password",p);
   toast("Contraseña cambiada");
  };
 }

 if(app==="browser"){
  const c=makeWindow("Navegador");
  c.innerHTML="<h3>Navegador</h3><input id='url' placeholder='https://www.google.com' style='width:70%;padding:10px'><button id='go'>Ir</button><iframe id='frame' style='width:100%;height:250px;margin-top:12px'></iframe>";
  c.querySelector("#go").onclick=()=>{
   let url=c.querySelector("#url").value.trim();
   if(!url)return;
   if(!/^https?:\/\//i.test(url))url="https://"+url;
   c.querySelector("#frame").src=url;
  };
 }
}

function calcPress(k,d){
 if(k==="C"){d.value="0";return}
 if(k==="="){
  try{
   const exp=d.value.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
   if(!/^[0-9+\-*/.() ]+$/.test(exp))throw Error();
   const result=Function('"use strict";return ('+exp+')')();
   if(!Number.isFinite(result))throw Error();
   d.value=result;
  }catch(e){d.value="Error"}
  return;
 }
 d.value=d.value==="0"?k:d.value+k;
}

const savedBg=localStorage.getItem("w2bg");
if(savedBg)document.getElementById("desktop").style.background=savedBg;
</script>
</body>
    </html>
